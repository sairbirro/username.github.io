<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرسيدس AMG GT</title>
    <style>
        /* أنماط CSS (نفس الأنماط السابقة مع إضافة تعديل بسيط للمؤشر) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            /* منع تحديد النص في جميع العناصر */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #3a0303 0%, #1f0202 50%, #0a0101 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .slider { position: relative; width: 100%; height: 35vh; min-height: 200px; max-height: 280px; background: #000; overflow: hidden; flex-shrink: 0; }
        .slider-images { position: relative; width: 100%; height: 100%; }
        .slider-images img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease; cursor: pointer; }
        .slider-images img.active { opacity: 1; }
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 35px; height: 35px; background: rgba(58, 3, 3, 0.8); color: white; border: 1px solid #d4af37; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        .slider-btn:hover { background: #3a0303; }
        .slider-prev { left: 10px; }
        .slider-next { right: 10px; }
        .slider-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; }
        .slider-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.4); border: 1px solid #d4af37; cursor: pointer; }
        .slider-dot.active { background: #d4af37; }
        .slider-counter { position: absolute; top: 10px; right: 10px; background: rgba(58, 3, 3, 0.8); color: white; padding: 4px 10px; border-radius: 15px; font-size: 12px; border: 1px solid #d4af37; z-index: 10; }
        .content { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .car-title { color: #d4af37; font-size: 1.5em; text-align: center; margin-bottom: 10px; border-bottom: 1px solid #d4af37; padding-bottom: 5px; }
        .info-grid { display: flex; gap: 10px; margin-bottom: 12px; }
        .info-item { flex: 1; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 8px; text-align: center; }
        .info-label { color: #d4af37; font-size: 0.7em; margin-bottom: 3px; }
        .info-value { color: white; font-size: 0.95em; font-weight: bold; }
        .price-box { border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 8px; margin-bottom: 12px; text-align: center; }
        .price-label { color: #d4af37; font-size: 0.75em; margin-bottom: 3px; }
        .price-value { color: #00ff00; font-size: 1.2em; font-weight: bold; }
        .description-box { border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 12px; margin-bottom: 15px; flex: 2; min-height: 120px; max-height: none; overflow-y: auto; background: rgba(0, 0, 0, 0.2); }
        .description-label { color: #d4af37; font-size: 0.75em; margin-bottom: 5px; }
        .description-text { color: white; font-size: 0.85em; line-height: 1.5; text-align: right; }
        .whatsapp-btn {
            background: #25d366;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 0.8em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin: 5px auto 0;
            width: fit-content;
            transition: all 0.3s ease;
        }
        .whatsapp-btn:hover { background: #128c7e; transform: scale(1.02); }
        .whatsapp-btn span { font-size: 1em; }
        .preview-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; visibility: hidden; transition: 0.3s; touch-action: none; }
        .preview-modal.active { opacity: 1; visibility: visible; }
        .preview-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .preview-image-wrapper { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
        .preview-image { max-width: 90%; max-height: 80vh; object-fit: contain; border: 2px solid #d4af37; border-radius: 5px; transition: transform 0.1s ease; transform-origin: center center; transform: scale(var(--zoom-level, 1)) translate(var(--translate-x, 0px), var(--translate-y, 0px)); will-change: transform; touch-action: none; }
        .preview-close { position: absolute; top: 15px; right: 15px; width: 40px; height: 40px; background: #3a0303; color: white; border: 1px solid #d4af37; border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2001; }
        .preview-counter { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: #3a0303; color: white; padding: 6px 18px; border-radius: 20px; font-size: 13px; border: 1px solid #d4af37; z-index: 2001; }
        .preview-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; background: #3a0303; color: white; border: 1px solid #d4af37; border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2001; }
        .preview-prev { left: 15px; }
        .preview-next { right: 15px; }
        .description-box::-webkit-scrollbar { width: 4px; }
        .description-box::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); }
        .description-box::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 4px; }
        @media (max-height: 600px) { .slider { height: 30vh; min-height: 160px; } .description-box { min-height: 90px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="slider" id="slider">
            <div class="slider-images" id="sliderImages"></div>
            <button class="slider-btn slider-prev" onclick="prevSlide()">❮</button>
            <button class="slider-btn slider-next" onclick="nextSlide()">❯</button>
            <div class="slider-dots" id="sliderDots"></div>
            <div class="slider-counter" id="sliderCounter">1 / 4</div>
        </div>
        <div class="content">
            <div>
                <h1 class="car-title" id="carName">مرسيدس AMG GT</h1>
                <div class="info-grid">
                    <div class="info-item"><div class="info-label">المحافظة</div><div class="info-value" id="carCity">دمشق</div></div>
                    <div class="info-item"><div class="info-label">الحالة</div><div class="info-value" id="carCondition">جديدة</div></div>
                </div>
                <div class="price-box"><div class="price-label">💰 السعر</div><div class="price-value" id="carPrice">250,000 دولار</div></div>
            </div>
            <div class="description-box">
                <div class="description-label">📋 الوصف</div>
                <div class="description-text" id="carDescription"></div>
            </div>
            <!-- زر واتساب المعدل ليطلب الموقع أولاً -->
            <button class="whatsapp-btn" onclick="requestLocationAndSendMessage()">
                <span>📱</span> واتساب
            </button>
        </div>
    </div>

    <div class="preview-modal" id="previewModal" onclick="closePreview(event)">
        <div class="preview-close" onclick="closePreview()">✕</div>
        <div class="preview-nav preview-prev" onclick="prevPreviewImage()">❮</div>
        <div class="preview-nav preview-next" onclick="nextPreviewImage()">❯</div>
        <div class="preview-container">
            <div class="preview-image-wrapper" id="previewImageWrapper">
                <img class="preview-image" id="previewImage" src="" alt="معاينة" style="--zoom-level: 1; --translate-x: 0px; --translate-y: 0px;">
            </div>
        </div>
        <div class="preview-counter" id="previewCounter"></div>
    </div>

    <script>
        // بيانات السيارة
        const carData = {
            name: 'مرسيدس AMG GT',
            price: '250,000',
            city: 'دمشق',
            condition: 'جديدة',
            description: `سيارة رياضية فاخرة بمحرك V8 ثنائي التوربو بقوة 577 حصان. تتسارع من 0 إلى 100 كم/س في 3.2 ثانية فقط. تصميم ديناميكي هوائي وهيكل من الألمنيوم خفيف الوزن. مقصورة داخلية فاخرة مع شاشة رقمية ونظام صوتي محيطي. مقاعد جلدية مع خاصية التدفئة والتبريد.`,
            images: [
                
                'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=600',
                'https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=600',
                'https://images.unsplash.com/photo-1553440569-bcc63803a83d?w=600'
            ],
            whatsappNumber: '905468064113'
        };

        let currentIndex = 0;
        let previewIndex = 0;
        let currentZoom = 1;
        let translateX = 0, translateY = 0;
        let initialDistance = null;
        let initialZoom = 1;
        let touchStartX = 0, touchStartY = 0;
        let isTouching = false;

        window.onload = function() {
            loadSliderImages();
            loadCarInfo();
            
            // منع أحداث النسخ والقص واللصق (بدون رسالة)
            document.addEventListener('copy', function(e) { e.preventDefault(); });
            document.addEventListener('cut', function(e) { e.preventDefault(); });
            document.addEventListener('paste', function(e) { e.preventDefault(); });
            
            // منع قائمة السياق (الزر الأيمن للفأرة)
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            
            // منع اختصار النسخ Ctrl+C و Ctrl+X
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'x')) {
                    e.preventDefault();
                }
            });
        };

        function loadSliderImages() {
            const sliderDiv = document.getElementById('sliderImages');
            const dotsDiv = document.getElementById('sliderDots');
            carData.images.forEach((imgSrc, index) => {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.alt = carData.name;
                img.onclick = () => openPreview(index);
                if (index === 0) img.className = 'active';
                sliderDiv.appendChild(img);
            });
            carData.images.forEach((_, index) => {
                const dot = document.createElement('span');
                dot.className = `slider-dot ${index === 0 ? 'active' : ''}`;
                dot.onclick = () => goToSlide(index);
                dotsDiv.appendChild(dot);
            });
            updateCounter();
        }

        function loadCarInfo() {
            document.getElementById('carName').textContent = carData.name;
            document.getElementById('carCity').textContent = carData.city;
            document.getElementById('carCondition').textContent = carData.condition;
            document.getElementById('carPrice').textContent = carData.price + ' دولار';
            document.getElementById('carDescription').textContent = carData.description;
        }

        window.goToSlide = function(index) {
            const images = document.querySelectorAll('.slider-images img');
            const dots = document.querySelectorAll('.slider-dot');
            if (index >= 0 && index < images.length) {
                images.forEach(img => img.classList.remove('active'));
                dots.forEach(dot => dot.classList.remove('active'));
                images[index].classList.add('active');
                dots[index].classList.add('active');
                currentIndex = index;
                updateCounter();
            }
        };

        window.prevSlide = function() {
            let newIndex = currentIndex - 1;
            if (newIndex < 0) newIndex = carData.images.length - 1;
            goToSlide(newIndex);
        };

        window.nextSlide = function() {
            let newIndex = currentIndex + 1;
            if (newIndex >= carData.images.length) newIndex = 0;
            goToSlide(newIndex);
        };

        function updateCounter() {
            document.getElementById('sliderCounter').textContent = `${currentIndex + 1} / ${carData.images.length}`;
        }

        window.openPreview = function(index) {
            previewIndex = index;
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            updatePreviewTransform();
            const modal = document.getElementById('previewModal');
            const previewImg = document.getElementById('previewImage');
            previewImg.src = carData.images[index];
            document.getElementById('previewCounter').textContent = `${index + 1} / ${carData.images.length}`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            setupTouchListeners();
        };

        window.closePreview = function(event) {
            if (!event || event.target.classList.contains('preview-modal') || event.target.classList.contains('preview-close')) {
                document.getElementById('previewModal').classList.remove('active');
                document.body.style.overflow = '';
                removeTouchListeners();
            }
        };

        window.prevPreviewImage = function() {
            previewIndex = (previewIndex - 1 + carData.images.length) % carData.images.length;
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            updatePreviewTransform();
            updatePreviewImage();
        };

        window.nextPreviewImage = function() {
            previewIndex = (previewIndex + 1) % carData.images.length;
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            updatePreviewTransform();
            updatePreviewImage();
        };

        function updatePreviewImage() {
            document.getElementById('previewImage').src = carData.images[previewIndex];
            document.getElementById('previewCounter').textContent = `${previewIndex + 1} / ${carData.images.length}`;
        }

        function updatePreviewTransform() {
            const previewImage = document.getElementById('previewImage');
            previewImage.style.setProperty('--zoom-level', currentZoom);
            previewImage.style.setProperty('--translate-x', translateX + 'px');
            previewImage.style.setProperty('--translate-y', translateY + 'px');
        }

        function setupTouchListeners() {
            const wrapper = document.getElementById('previewImageWrapper');
            wrapper.addEventListener('touchstart', handleTouchStart, { passive: false });
            wrapper.addEventListener('touchmove', handleTouchMove, { passive: false });
            wrapper.addEventListener('touchend', handleTouchEnd);
        }

        function removeTouchListeners() {
            const wrapper = document.getElementById('previewImageWrapper');
            wrapper.removeEventListener('touchstart', handleTouchStart);
            wrapper.removeEventListener('touchmove', handleTouchMove);
            wrapper.removeEventListener('touchend', handleTouchEnd);
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touches = e.touches;
            if (touches.length === 2) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                initialDistance = Math.sqrt(dx * dx + dy * dy);
                initialZoom = currentZoom;
            } else if (touches.length === 1 && currentZoom > 1) {
                isTouching = true;
                touchStartX = touches[0].clientX - translateX;
                touchStartY = touches[0].clientY - translateY;
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const touches = e.touches;
            if (touches.length === 2) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                const currentDistance = Math.sqrt(dx * dx + dy * dy);
                if (initialDistance) {
                    const scale = currentDistance / initialDistance;
                    let newZoom = initialZoom * scale;
                    newZoom = Math.max(0.5, Math.min(3, newZoom));
                    if (newZoom !== currentZoom) {
                        currentZoom = newZoom;
                        updatePreviewTransform();
                    }
                }
            } else if (touches.length === 1 && currentZoom > 1 && isTouching) {
                const touch = touches[0];
                const newTranslateX = touch.clientX - touchStartX;
                const newTranslateY = touch.clientY - touchStartY;
                const maxTranslate = 100 * (currentZoom - 1);
                translateX = Math.max(-maxTranslate, Math.min(maxTranslate, newTranslateX));
                translateY = Math.max(-maxTranslate, Math.min(maxTranslate, newTranslateY));
                updatePreviewTransform();
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            initialDistance = null;
            isTouching = false;
        }

        // دالة جديدة: طلب الموقع ثم فتح واتساب
        window.requestLocationAndSendMessage = function() {
            // التحقق إذا كان المتصفح يدعم خدمة تحديد الموقع
            if (navigator.geolocation) {
                // طلب الموقع من المستخدم
                navigator.geolocation.getCurrentPosition(
                    // إذا وافق المستخدم على مشاركة الموقع
                    function(position) {
                        const latitude = position.coords.latitude;
                        const longitude = position.coords.longitude;
                        
                        // إنشاء رابط خرائط جوجل للموقع
                        const locationLink = `https://www.google.com/maps?q=${latitude},${longitude}`;
                        
                        // إنشاء الرسالة مع رابط الموقع
                        const message = encodeURIComponent(
                            `مرحباً، أريد الاستفسار عن السيارة ${carData.name}\n` +
                            `رابط موقعي: ${locationLink}\n` +
                            `(تمت مشاركة الموقع تلقائياً)`
                        );
                        
                        // فتح واتساب
                        window.open(`https://wa.me/${carData.whatsappNumber}?text=${message}`, '_blank');
                    },
                    // إذا رفض المستخدم مشاركة الموقع أو حدث خطأ
                    function(error) {
                        console.log("خطأ في الحصول على الموقع:", error);
                        
                        // رسالة بديلة بدون موقع
                        let errorMessage = "";
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMessage = "لم تتم مشاركة الموقع (تم رفض الإذن)";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMessage = "لم تتم مشاركة الموقع (المعلومات غير متوفرة)";
                                break;
                            case error.TIMEOUT:
                                errorMessage = "لم تتم مشاركة الموقع (انتهى الوقت)";
                                break;
                            default:
                                errorMessage = "لم تتم مشاركة الموقع (خطأ غير معروف)";
                        }
                        
                        const message = encodeURIComponent(
                            `مرحباً، أريد الاستفسار عن السيارة ${carData.name}\n` +
                            `${errorMessage}`
                        );
                        
                        window.open(`https://wa.me/${carData.whatsappNumber}?text=${message}`, '_blank');
                    },
                    // إعدادات إضافية
                    {
                        enableHighAccuracy: true, // دقة عالية
                        timeout: 10000, // مهلة 10 ثواني
                        maximumAge: 0 // عدم استخدام موقع مخزن مؤقتاً
                    }
                );
            } else {
                // المتصفح لا يدعم خدمة الموقع
                const message = encodeURIComponent(
                    `مرحباً، أريد الاستفسار عن السيارة ${carData.name}\n` +
                    `(المتصفح لا يدعم مشاركة الموقع)`
                );
                window.open(`https://wa.me/${carData.whatsappNumber}?text=${message}`, '_blank');
            }
        };

        let autoSlide = setInterval(() => nextSlide(), 2000);
        document.getElementById('slider').addEventListener('mouseenter', () => { clearInterval(autoSlide); });
        document.getElementById('slider').addEventListener('mouseleave', () => { autoSlide = setInterval(() => nextSlide(), 2000); });
    </script>
</body>
</html>
