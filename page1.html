<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرسيدس AMG GT</title>
    <style>
        /* أنماط CSS (نفس الأنماط السابقة مع إضافة تعديل بسيط للمؤشر) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            /* منع تحديد النص في جميع العناصر */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #3a0303 0%, #1f0202 50%, #0a0101 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .slider { 
            position: relative; 
            width: 100%; 
            height: 35vh; 
            min-height: 200px; 
            max-height: 280px; 
            background: #000; 
            overflow: hidden; 
            flex-shrink: 0; 
        }
        .slider-images { 
            position: relative; 
            width: 100%; 
            height: 100%; 
        }
        .slider-images img { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            opacity: 0; 
            transition: opacity 0.5s ease; 
            cursor: pointer; 
        }
        .slider-images img.active { 
            opacity: 1; 
        }
        .slider-btn { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            width: 35px; 
            height: 35px; 
            background: rgba(58, 3, 3, 0.8); 
            color: white; 
            border: 1px solid #d4af37; 
            border-radius: 50%; 
            font-size: 18px; 
            cursor: pointer; 
            z-index: 10; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .slider-btn:hover { 
            background: #3a0303; 
            transform: translateY(-50%) scale(1.1);
        }
        .slider-prev { left: 10px; }
        .slider-next { right: 10px; }
        .slider-dots { 
            position: absolute; 
            bottom: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 6px; 
            z-index: 10; 
        }
        .slider-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.4); 
            border: 1px solid #d4af37; 
            cursor: pointer; 
        }
        .slider-dot.active { 
            background: #d4af37; 
        }
        .slider-counter { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: rgba(58, 3, 3, 0.8); 
            color: white; 
            padding: 4px 10px; 
            border-radius: 15px; 
            font-size: 12px; 
            border: 1px solid #d4af37; 
            z-index: 10; 
        }
        
        /* شريط الحالة */
        .condition-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #d4af37;
            color: #3a0303;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7em;
            font-weight: bold;
            z-index: 20;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .content { 
            padding: 15px; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
        }
        .car-title { 
            color: #d4af37; 
            font-size: 1.5em; 
            text-align: center; 
            margin-bottom: 10px; 
            border-bottom: 1px solid #d4af37; 
            padding-bottom: 5px; 
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .info-grid { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 12px; 
        }
        
        /* تصميم البطاقات الزجاجية */
        .info-item, .price-box, .description-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        /* تأثير اللمعة */
        .info-item::before, .price-box::before, .description-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.1) 50%,
                transparent 70%
            );
            transform: rotate(30deg);
            animation: shimmer 8s infinite linear;
            pointer-events: none;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(30deg); }
            20% { transform: translateX(100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }
        
        .info-item { 
            flex: 1; 
            border-radius: 12px; 
            padding: 10px; 
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .info-item:hover { 
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(212, 175, 55, 0.3), inset 0 1px 3px rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }
        .info-label { 
            color: #d4af37; 
            font-size: 0.7em; 
            margin-bottom: 5px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .info-item:first-child .info-label::before {
            content: "🏙️ ";
            opacity: 0.9;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }
        .info-item:last-child .info-label::before {
            content: "✨ ";
            opacity: 0.9;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }
        .info-value { 
            color: white; 
            font-size: 1.1em; 
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }
        
        /* حاوية السعر وزر الواتساب */
        .price-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .price-box { 
            flex: 1;
            border-radius: 12px; 
            padding: 10px; 
            text-align: center;
            width: auto;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .price-box:hover { 
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(212, 175, 55, 0.3), inset 0 1px 3px rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }
        .price-label { 
            color: #d4af37; 
            font-size: 0.75em; 
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .price-value { 
            color: #00ff00; 
            font-size: 1.2em; 
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
            position: relative;
            z-index: 2;
        }
        @keyframes glow {
            from { text-shadow: 0 0 5px rgba(0, 255, 0, 0.3), 0 2px 4px rgba(0,0,0,0.5); }
            to { text-shadow: 0 0 15px rgba(0, 255, 0, 0.7), 0 2px 4px rgba(0,0,0,0.5); }
        }
        
        /* زر واتساب الجديد - أيقونة مفرغة */
        .whatsapp-icon-btn {
            background: transparent;
            border: 2px solid #25d366;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 0;
            flex-shrink: 0;
            animation: pulse 2s infinite;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7), 0 4px 10px rgba(0,0,0,0.3); }
            70% { box-shadow: 0 0 0 10px rgba(37, 211, 102, 0), 0 4px 15px rgba(0,0,0,0.4); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0), 0 4px 10px rgba(0,0,0,0.3); }
        }
        .whatsapp-icon-btn:hover {
            background: rgba(37, 211, 102, 0.15);
            transform: scale(1.1) rotate(5deg);
            border-color: #128c7e;
            animation: none;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
        }
        .whatsapp-icon-btn svg {
            width: 28px;
            height: 28px;
            fill: #25d366;
            transition: fill 0.3s ease;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }
        .whatsapp-icon-btn:hover svg {
            fill: #128c7e;
        }
        
        .description-box { 
            border-radius: 12px; 
            padding: 15px; 
            margin-top: 5px; /* رفع المربع للأعلى */
            margin-bottom: 15px; 
            flex: 2; 
            min-height: 160px; /* تقليل الارتفاع قليلاً */
            max-height: 220px; 
            overflow-y: auto; 
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .description-box:hover { 
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(212, 175, 55, 0.3), inset 0 1px 3px rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }
        .description-label { 
            color: #d4af37; 
            font-size: 0.75em; 
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }
        .description-text { 
            color: white; 
            font-size: 0.95em; 
            line-height: 1.6; 
            text-align: right;
            position: relative;
            z-index: 2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        
        /* إخفاء الزر القديم */
        .old-whatsapp-btn {
            display: none;
        }
        
        .preview-modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.95); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 2000; 
            opacity: 0; 
            visibility: hidden; 
            transition: 0.3s; 
            touch-action: none; 
        }
        .preview-modal.active { 
            opacity: 1; 
            visibility: visible; 
        }
        .preview-container { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative; 
        }
        .preview-image-wrapper { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            touch-action: none; 
        }
        .preview-image { 
            max-width: 90%; 
            max-height: 80vh; 
            object-fit: contain; 
            border: 2px solid #d4af37; 
            border-radius: 5px; 
            transition: transform 0.1s ease; 
            transform-origin: center center; 
            transform: scale(var(--zoom-level, 1)) translate(var(--translate-x, 0px), var(--translate-y, 0px)); 
            will-change: transform; 
            touch-action: none; 
        }
        .preview-close { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            width: 40px; 
            height: 40px; 
            background: #3a0303; 
            color: white; 
            border: 1px solid #d4af37; 
            border-radius: 50%; 
            font-size: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            z-index: 2001; 
        }
        .preview-counter { 
            position: absolute; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #3a0303; 
            color: white; 
            padding: 6px 18px; 
            border-radius: 20px; 
            font-size: 13px; 
            border: 1px solid #d4af37; 
            z-index: 2001; 
        }
        .preview-nav { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            width: 40px; 
            height: 40px; 
            background: #3a0303; 
            color: white; 
            border: 1px solid #d4af37; 
            border-radius: 50%; 
            font-size: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            z-index: 2001; 
        }
        .preview-prev { left: 15px; }
        .preview-next { right: 15px; }
        
        /* تحسين شريط التمرير */
        .description-box::-webkit-scrollbar { 
            width: 6px; 
        }
        .description-box::-webkit-scrollbar-track { 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 10px;
        }
        .description-box::-webkit-scrollbar-thumb { 
            background: #d4af37; 
            border-radius: 10px; 
            border: 1px solid #3a0303; 
        }
        
        @media (max-height: 600px) { 
            .slider { height: 30vh; min-height: 160px; } 
            .description-box { min-height: 130px; max-height: 180px; } 
        }
        @media (max-height: 700px) and (min-height: 601px) {
            .description-box { min-height: 140px; max-height: 200px; }
        }
        @media (max-width: 350px) {
            .whatsapp-icon-btn {
                width: 42px;
                height: 42px;
            }
            .whatsapp-icon-btn svg {
                width: 24px;
                height: 24px;
            }
        }
        @media (max-width: 320px) {
            .price-container {
                flex-wrap: wrap;
            }
            .whatsapp-icon-btn {
                width: 100%;
                border-radius: 30px;
                margin-top: 5px;
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="slider" id="slider">
            <div class="slider-images" id="sliderImages"></div>
            <button class="slider-btn slider-prev" onclick="prevSlide()">❮</button>
            <button class="slider-btn slider-next" onclick="nextSlide()">❯</button>
            <div class="slider-dots" id="sliderDots"></div>
            <div class="slider-counter" id="sliderCounter">1 / 4</div>
            <div class="condition-badge">✨ جديد</div>
        </div>
        <div class="content">
            <div>
                <h1 class="car-title" id="carName">مرسيدس AMG GT</h1>
                <div class="info-grid">
                    <div class="info-item"><div class="info-label">المحافظة</div><div class="info-value" id="carCity">دمشق</div></div>
                    <div class="info-item"><div class="info-label">الحالة</div><div class="info-value" id="carCondition">جديدة</div></div>
                </div>
                
                <!-- حاوية السعر وزر الواتساب -->
                <div class="price-container">
                    <div class="price-box">
                        <div class="price-label">💰 السعر</div>
                        <div class="price-value" id="carPrice">250,000 دولار</div>
                    </div>
                    <button class="whatsapp-icon-btn" onclick="requestLocationAndSendMessage()" title="تواصل عبر واتساب">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                            <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.2-99.6 224.2-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54.5-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="description-box">
                <div class="description-label">📋 الوصف</div>
                <div class="description-text" id="carDescription"></div>
            </div>
            
            <!-- زر واتساب القديم (مخفي) -->
            <button class="old-whatsapp-btn" onclick="requestLocationAndSendMessage()">
                <span>📱</span> واتساب
            </button>
        </div>
    </div>

    <div class="preview-modal" id="previewModal" onclick="closePreview(event)">
        <div class="preview-close" onclick="closePreview()">✕</div>
        <div class="preview-nav preview-prev" onclick="prevPreviewImage()">❮</div>
        <div class="preview-nav preview-next" onclick="nextPreviewImage()">❯</div>
        <div class="preview-container">
            <div class="preview-image-wrapper" id="previewImageWrapper">
                <img class="preview-image" id="previewImage" src="" alt="معاينة" style="--zoom-level: 1; --translate-x: 0px; --translate-y: 0px;">
            </div>
        </div>
        <div class="preview-counter" id="previewCounter"></div>
    </div>

    <script>
        // بيانات السيارة
        const carData = {
            name: 'مرسيدس AMG GT',
            price: '250,000',
            city: 'دمشق',
            condition: 'جديدة',
            description: `سيارة رياضية فاخرة بمحرك V8 ثنائي التوربو بقوة 577 حصان. تتسارع من 0 إلى 100 كم/س في 3.2 ثانية فقط. تصميم ديناميكي هوائي وهيكل من الألمنيوم خفيف الوزن. مقصورة داخلية فاخرة مع شاشة رقمية ونظام صوتي محيطي. مقاعد جلدية مع خاصية التدفئة والتبريد.`,
            images: [
                
                'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=600',
                'https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=600',
                'https://images.unsplash.com/photo-1553440569-bcc63803a83d?w=600'
            ],
            whatsappNumber: '905468064113'
        };

        let currentIndex = 0;
        let previewIndex = 0;
        let currentZoom = 1;
        let translateX = 0, translateY = 0;
        let initialDistance = null;
        let initialZoom = 1;
        let touchStartX = 0, touchStartY = 0;
        let isTouching = false;

        window.onload = function() {
            loadSliderImages();
            loadCarInfo();
            
            // منع أحداث النسخ والقص واللصق (بدون رسالة)
            document.addEventListener('copy', function(e) { e.preventDefault(); });
            document.addEventListener('cut', function(e) { e.preventDefault(); });
            document.addEventListener('paste', function(e) { e.preventDefault(); });
            
            // منع قائمة السياق (الزر الأيمن للفأرة)
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            
            // منع اختصار النسخ Ctrl+C و Ctrl+X
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'x')) {
                    e.preventDefault();
                }
            });
        };

        function loadSliderImages() {
            const sliderDiv = document.getElementById('sliderImages');
            const dotsDiv = document.getElementById('sliderDots');
            carData.images.forEach((imgSrc, index) => {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.alt = carData.name;
                img.onclick = () => openPreview(index);
                if (index === 0) img.className = 'active';
                sliderDiv.appendChild(img);
            });
            carData.images.forEach((_, index) => {
                const dot = document.createElement('span');
                dot.className = `slider-dot ${index === 0 ? 'active' : ''}`;
                dot.onclick = () => goToSlide(index);
                dotsDiv.appendChild(dot);
            });
            updateCounter();
        }

        function loadCarInfo() {
            document.getElementById('carName').textContent = carData.name;
            document.getElementById('carCity').textContent = carData.city;
            document.getElementById('carCondition').textContent = carData.condition;
            document.getElementById('carPrice').textContent = carData.price + ' دولار';
            document.getElementById('carDescription').textContent = carData.description;
        }

        window.goToSlide = function(index) {
            const images = document.querySelectorAll('.slider-images img');
            const dots = document.querySelectorAll('.slider-dot');
            if (index >= 0 && index < images.length) {
                images.forEach(img => img.classList.remove('active'));
                dots.forEach(dot => dot.classList.remove('active'));
                images[index].classList.add('active');
                dots[index].classList.add('active');
                currentIndex = index;
                updateCounter();
            }
        };

        window.prevSlide = function() {
            let newIndex = currentIndex - 1;
            if (newIndex < 0) newIndex = carData.images.length - 1;
            goToSlide(newIndex);
        };

        window.nextSlide = function() {
            let newIndex = currentIndex + 1;
            if (newIndex >= carData.images.length) newIndex = 0;
            goToSlide(newIndex);
        };

        function updateCounter() {
            document.getElementById('sliderCounter').textContent = `${currentIndex + 1} / ${carData.images.length}`;
        }

        window.openPreview = function(index) {
            previewIndex = index;
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            updatePreviewTransform();
            const modal = document.getElementById('previewModal');
            const previewImg = document.getElementById('previewImage');
            previewImg.src = carData.images[index];
            document.getElementById('previewCounter').textContent = `${index + 1} / ${carData.images.length}`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            setupTouchListeners();
        };

        window.closePreview = function(event) {
            if (!event || event.target.classList.contains('preview-modal') || event.target.classList.contains('preview-close')) {
                document.getElementById('previewModal').classList.remove('active');
                document.body.style.overflow = '';
                removeTouchListeners();
            }
        };

        window.prevPreviewImage = function() {
            previewIndex = (previewIndex - 1 + carData.images.length) % carData.images.length;
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            updatePreviewTransform();
            updatePreviewImage();
        };

        window.nextPreviewImage = function() {
            previewIndex = (previewIndex + 1) % carData.images.length;
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            updatePreviewTransform();
            updatePreviewImage();
        };

        function updatePreviewImage() {
            document.getElementById('previewImage').src = carData.images[previewIndex];
            document.getElementById('previewCounter').textContent = `${previewIndex + 1} / ${carData.images.length}`;
        }

        function updatePreviewTransform() {
            const previewImage = document.getElementById('previewImage');
            previewImage.style.setProperty('--zoom-level', currentZoom);
            previewImage.style.setProperty('--translate-x', translateX + 'px');
            previewImage.style.setProperty('--translate-y', translateY + 'px');
        }

        function setupTouchListeners() {
            const wrapper = document.getElementById('previewImageWrapper');
            wrapper.addEventListener('touchstart', handleTouchStart, { passive: false });
            wrapper.addEventListener('touchmove', handleTouchMove, { passive: false });
            wrapper.addEventListener('touchend', handleTouchEnd);
        }

        function removeTouchListeners() {
            const wrapper = document.getElementById('previewImageWrapper');
            wrapper.removeEventListener('touchstart', handleTouchStart);
            wrapper.removeEventListener('touchmove', handleTouchMove);
            wrapper.removeEventListener('touchend', handleTouchEnd);
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touches = e.touches;
            if (touches.length === 2) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                initialDistance = Math.sqrt(dx * dx + dy * dy);
                initialZoom = currentZoom;
            } else if (touches.length === 1 && currentZoom > 1) {
                isTouching = true;
                touchStartX = touches[0].clientX - translateX;
                touchStartY = touches[0].clientY - translateY;
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const touches = e.touches;
            if (touches.length === 2) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                const currentDistance = Math.sqrt(dx * dx + dy * dy);
                if (initialDistance) {
                    const scale = currentDistance / initialDistance;
                    let newZoom = initialZoom * scale;
                    newZoom = Math.max(0.5, Math.min(3, newZoom));
                    if (newZoom !== currentZoom) {
                        currentZoom = newZoom;
                        updatePreviewTransform();
                    }
                }
            } else if (touches.length === 1 && currentZoom > 1 && isTouching) {
                const touch = touches[0];
                const newTranslateX = touch.clientX - touchStartX;
                const newTranslateY = touch.clientY - touchStartY;
                const maxTranslate = 100 * (currentZoom - 1);
                translateX = Math.max(-maxTranslate, Math.min(maxTranslate, newTranslateX));
                translateY = Math.max(-maxTranslate, Math.min(maxTranslate, newTranslateY));
                updatePreviewTransform();
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            initialDistance = null;
            isTouching = false;
        }

        // دالة جديدة: طلب الموقع ثم فتح واتساب
        window.requestLocationAndSendMessage = function() {
            // التحقق إذا كان المتصفح يدعم خدمة تحديد الموقع
            if (navigator.geolocation) {
                // طلب الموقع من المستخدم
                navigator.geolocation.getCurrentPosition(
                    // إذا وافق المستخدم على مشاركة الموقع
                    function(position) {
                        const latitude = position.coords.latitude;
                        const longitude = position.coords.longitude;
                        
                        // إنشاء رابط خرائط جوجل للموقع
                        const locationLink = `https://www.google.com/maps?q=${latitude},${longitude}`;
                        
                        // إنشاء الرسالة مع رابط الموقع
                        const message = encodeURIComponent(
                            `مرحباً، أريد الاستفسار عن السيارة ${carData.name}\n` +
                            `رابط موقعي: ${locationLink}\n` +
                            `(تمت مشاركة الموقع تلقائياً)`
                        );
                        
                        // فتح واتساب
                        window.open(`https://wa.me/${carData.whatsappNumber}?text=${message}`, '_blank');
                    },
                    // إذا رفض المستخدم مشاركة الموقع أو حدث خطأ
                    function(error) {
                        console.log("خطأ في الحصول على الموقع:", error);
                        
                        // رسالة بديلة بدون موقع
                        let errorMessage = "";
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMessage = "لم تتم مشاركة الموقع (تم رفض الإذن)";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMessage = "لم تتم مشاركة الموقع (المعلومات غير متوفرة)";
                                break;
                            case error.TIMEOUT:
                                errorMessage = "لم تتم مشاركة الموقع (انتهى الوقت)";
                                break;
                            default:
                                errorMessage = "لم تتم مشاركة الموقع (خطأ غير معروف)";
                        }
                        
                        const message = encodeURIComponent(
                            `مرحباً، أريد الاستفسار عن السيارة ${carData.name}\n` +
                            `${errorMessage}`
                        );
                        
                        window.open(`https://wa.me/${carData.whatsappNumber}?text=${message}`, '_blank');
                    },
                    // إعدادات إضافية
                    {
                        enableHighAccuracy: true, // دقة عالية
                        timeout: 10000, // مهلة 10 ثواني
                        maximumAge: 0 // عدم استخدام موقع مخزن مؤقتاً
                    }
                );
            } else {
                // المتصفح لا يدعم خدمة الموقع
                const message = encodeURIComponent(
                    `مرحباً، أريد الاستفسار عن السيارة ${carData.name}\n` +
                    `(المتصفح لا يدعم مشاركة الموقع)`
                );
                window.open(`https://wa.me/${carData.whatsappNumber}?text=${message}`, '_blank');
            }
        };

        let autoSlide = setInterval(() => nextSlide(), 2000);
        document.getElementById('slider').addEventListener('mouseenter', () => { clearInterval(autoSlide); });
        document.getElementById('slider').addEventListener('mouseleave', () => { autoSlide = setInterval(() => nextSlide(), 2000); });
    </script>
</body>
</html>
